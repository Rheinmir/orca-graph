name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest --quiet
      - name: unit + contract tests
        run: python3 -m pytest -q tests
      - name: eval VT matrix (Reprise PRD v1.1 §30.1)
        run: python3 evals/run.py --check
      - name: install.sh cài được từ chính checkout này
        run: bash tests/install-test.sh
